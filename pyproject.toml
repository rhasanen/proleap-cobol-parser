[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "python-proleap-cobol-parser"
version = "0.1.0"
description = "Python bootstrap port of proleap-cobol-parser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "antlr4-python3-runtime==4.13.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
testpaths = [
  "tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proleap_cobol_parser"]
